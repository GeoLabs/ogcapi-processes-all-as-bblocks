openapi: 3.0.3
info:
  title: 'OGC API - Processes - Part 2: Deploy, Replace, Undeploy'
  version: 1.0.0
  description: 'This document is an API definition for OGC API - Processes - Part
    2: Deploy, Replace, Undeploy (DRU).

    This specification extends OGC API - Processes - Part 1: Core with process lifecycle
    management capabilities,

    allowing clients to deploy, replace, and undeploy processes dynamically.'
  contact:
    name: Open Geospatial Consortium (OGC)
    email: standards-team@ogc.org
    url: https://www.ogc.org/contacts
  license:
    name: OGC license
    url: http://www.ogc.org/legal/
paths:
  /processes:
    post:
      summary: Deploy a new process
      description: 'Deploy a new process to the server using an OGC Application Package.
        The process will be added to the list of available processes and can be executed.

        Supports both standard OGC Application Package format and CWL encoding.

        For more information, see Section 7 of OGC API - Processes - Part 2.'
      operationId: deployProcess
      tags:
      - Deploy
      parameters:
      - $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/parameters/w/openapi.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg/schema.yaml
          application/cwl+json:
            schema:
              $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg-cwl/schema.yaml
          application/cwl+yaml:
            schema:
              $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg-cwl/schema.yaml
      responses:
        201:
          description: Process successfully deployed
          content:
            application/json:
              schema:
                $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/responses/deploySuccess/schema.yaml
        400:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/InvalidParameter/openapi.yaml
        409:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/responses/duplicateProcess/schema.yaml
        500:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/ServerError/openapi.yaml
  /processes/{processId}:
    get:
      summary: Retrieve the deployment package of a process
      description: 'Access the formal description (OGC Application Package or CWL
        document) that was used  to deploy a process. This allows retrieving the executable
        definition of a deployed process.

        For more information, see Section 10 of OGC API - Processes - Part 2.'
      operationId: getPackage
      tags:
      - Package
      parameters:
      - $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/parameters/processIdPathParam/openapi.yaml
      responses:
        200:
          description: The deployment package of the process
          content:
            application/json:
              schema:
                $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg/schema.yaml
            application/cwl:
              schema:
                $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg-cwl/schema.yaml
            application/cwl+json:
              schema:
                $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg-cwl/schema.yaml
            application/cwl+yaml:
              schema:
                $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg-cwl/schema.yaml
        404:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/NotFound/openapi.yaml
        500:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/ServerError/openapi.yaml
    put:
      summary: Replace an existing process
      description: 'Replace an existing process with a new version using an OGC Application
        Package. The existing process will be updated with the new definition.

        Supports both standard OGC Application Package format and CWL encoding.

        For more information, see Section 8 of OGC API - Processes - Part 2.'
      operationId: replaceProcess
      tags:
      - Replace
      parameters:
      - $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/parameters/processIdPathParam/openapi.yaml
      - $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/parameters/w/openapi.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg/schema.yaml
          application/cwl+json:
            schema:
              $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg-cwl/schema.yaml
          application/cwl+yaml:
            schema:
              $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/schemas/ogcapppkg-cwl/schema.yaml
      responses:
        200:
          description: Process successfully replaced
          content:
            application/json:
              schema:
                $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/responses/replaceSuccess/schema.yaml
        404:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/NotFound/openapi.yaml
        400:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/InvalidParameter/openapi.yaml
        403:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/responses/immutableProcess/schema.yaml
        500:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/ServerError/openapi.yaml
    delete:
      summary: Undeploy a process
      description: 'Remove a deployed process from the server. The process will no
        longer be available for execution. Running jobs may be affected based on server
        implementation.

        For more information, see Section 9 of OGC API - Processes - Part 2.'
      operationId: undeployProcess
      tags:
      - Undeploy
      parameters:
      - $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/parameters/processIdPathParam/openapi.yaml
      responses:
        200:
          description: Process successfully undeployed
          content:
            application/json:
              schema:
                $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/responses/undeploySuccess/schema.yaml
        404:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/NotFound/openapi.yaml
        403:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part2/v1/responses/immutableProcess/schema.yaml
        500:
          $ref: https://geolabs.github.io/ogcapi-processes-all-as-bblocks/build/annotated/api/processes/part1/v1/responses/ServerError/openapi.yaml
